name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: "PHP Lint (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # 全PHPファイルを構文チェックし、最低対応バージョン(7.4)での互換性を担保する。
      - name: Lint all PHP files
        run: find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  phpcs:
    name: phpcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run phpcs
        run: composer run phpcs

  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    # WordPressコアのテストスイート(wp-phpunit/wp-phpunit、Composer経由)がPHPUnit 10以降の
    # 削除済みAPIにまだ依存しているため、PHPUnitは9.6系に固定している(composer.jsonのバージョン制約)。
    # そのため対応PHPバージョンもWP公式サポート範囲の 7.4〜8.3 に合わせる。
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          extensions: mysqli, zip, gd
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      # svn/Docker(wp-env)を使わず、wp-cli経由でABSPATH用のWordPress本体を別ディレクトリへ用意する。
      - name: Download WordPress core (for ABSPATH)
        run: |
          curl -sSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core download --path=/tmp/wordpress --force
      - name: Run PHPUnit
        env:
          WP_TESTS_ABSPATH: /tmp/wordpress
          WP_TESTS_DB_NAME: wordpress_test
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: ''
          WP_TESTS_DB_HOST: 127.0.0.1
        run: vendor/bin/phpunit

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: wordpress/plugin-check-action@v1
        with:
          # vendor / tests / node_modules は本番プラグインに含まれないため除外する。
          exclude-directories: 'vendor,tests,node_modules'
          # wp.org 配布前提ではないため plugin_repo は対象外。警告は情報として扱いエラーのみで失敗させる。
          categories: |
            general
            performance
            accessibility
            security
          ignore-warnings: true
          # フォルダ名(NExT-Block-Transporter)を期待スラッグと見なす TextDomainMismatch を無視する。
          # コードは正式スラッグ next-block-transporter で統一しており、大文字混在のフォルダ名由来の誤検出のため。
          ignore-codes: WordPress.WP.I18n.TextDomainMismatch
